<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>成长记录·进度</title>
<meta name="theme-color" content="#2D9CDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="styles.css">
<style>
  body{background:linear-gradient(135deg,#FFF3E0 0%,#EAF6FF 100%);display:block;}
  .widget-wrap{max-width:420px;margin:0 auto;padding:16px;}
  .widget-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .widget-header{text-align:center;}
  .widget-header .greet{font-size:22px;font-weight:800;color:var(--blue-d);}
  .widget-header .meta{font-size:13px;color:var(--muted);margin-top:4px;}
  .widget-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
  .w-stat{background:#F7F9FF;border-radius:14px;padding:12px 6px;text-align:center;}
  .w-stat .num{font-size:24px;font-weight:800;color:var(--blue-d);line-height:1.1;}
  .w-stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .widget-three{display:flex;flex-direction:column;gap:10px;}
  .w-thing{border-radius:14px;padding:13px 14px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s;}
  .w-thing:active{transform:scale(.98);}
  .w-thing.eat{background:linear-gradient(135deg,var(--green),var(--green-d));}
  .w-thing.sleep{background:linear-gradient(135deg,var(--purple),#5145c9);}
  .w-thing.move{background:linear-gradient(135deg,var(--orange),var(--orange-d));}
  .w-thing input{width:24px;height:24px;accent-color:#fff;flex:0 0 auto;cursor:pointer;}
  .w-thing .t{flex:1;font-weight:800;font-size:16px;}
  .w-thing .d{font-size:12px;opacity:.95;margin-top:2px;font-weight:500;}
  .w-time{background:rgba(255,255,255,.92);border:none;border-radius:6px;color:#222;font-size:13px;padding:2px 4px;width:78px;margin:0 2px;vertical-align:middle;}
  .ws-core{font-size:12px;font-weight:700;opacity:.95;margin-top:4px;}
  .widget-done{text-align:center;color:var(--green-d);font-weight:800;font-size:16px;padding:10px 0;}
  .widget-footer{text-align:center;margin-top:16px;}
  .widget-footer a{display:inline-block;background:var(--blue);color:#fff;padding:11px 20px;border-radius:20px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:var(--shadow);}
  .widget-footer a:active{transform:scale(.97);}
  .widget-tip{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="widget-wrap">
  <div class="widget-card widget-header">
    <div class="greet" id="wGreet">⚡ 宝贝</div>
    <div class="meta" id="wMeta">今天</div>
    <div class="widget-stats" id="wStats"></div>
  </div>
  <div class="widget-card">
    <h3 style="margin:0 0 12px;font-size:16px;">📋 今天的三件事</h3>
    <div class="widget-three" id="wThree"></div>
    <div class="widget-done" id="wDone" style="display:none">🎉 三件事都完成啦！</div>
  </div>
  <div class="widget-footer">
    <a href="index.html">打开完整版 ➜</a>
  </div>
  <div class="widget-tip">把这个页面也「添加到主屏幕」，就能像小组件一样一秒看进度。</div>
</div>
<script src="content.js"></script>
<script src="widget.js"></script>
</body>
</html>
