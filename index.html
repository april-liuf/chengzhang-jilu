<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>成长记录 · 儿子专属成长辅导</title>
<meta name="theme-color" content="#2D9CDB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">⚡ 成长记录
      <small id="childName">宝贝</small>
    </div>
    <div class="profile">
      <b id="childMeta">8岁 · 三年级</b>
      <span id="schoolLine"></span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button data-target="today" class="active">🏠 今天</button>
    <button data-target="study">📚 学习</button>
    <button data-target="diet">🍽️ 饮食</button>
    <button data-target="sport">🏃 运动</button>
    <button data-target="time">⏰ 时间</button>
    <button data-target="milestone">🌟 成长</button>
    <button data-target="parent">💬 亲子</button>
  </nav>
  <div class="sidebar-footer">
    <span id="ver"></span>
  </div>
</aside>

<div class="mobile-bar">
  <button class="menu-toggle" id="menuToggle" aria-label="打开菜单">☰</button>
  <span class="mobile-title">⚡ 成长记录</span>
</div>

<main class="wrap">
  <section id="today" class="active"></section>
  <section id="study"></section>
  <section id="sport"></section>
  <section id="time"></section>
  <section id="milestone"></section>
  <section id="diet"></section>
  <section id="parent"></section>

  <footer>
    「成长记录」—— 陪你慢慢长大 🌱<br>
    <span id="ver"></span> · 数据只保存在本机浏览器（离线可用）· 妈妈出差也能随时补打卡
    <div class="data-tools">
      <button class="btn ghost" id="exportData">⬇️ 备份数据</button>
      <label class="btn ghost" for="importData" style="display:inline-block;cursor:pointer">⬆️ 恢复数据</label>
      <input type="file" id="importData" accept="application/json" style="display:none">
    </div>
    <div class="note-line">📱 手机/iPad 使用：浏览器打开本页 → 点「分享」→「添加到主屏幕」，就能像 App 一样打卡。公网地址：<a href="https://april-liuf.github.io/chengzhang-jilu/" target="_blank" rel="noopener">april-liuf.github.io/chengzhang-jilu</a>（任意网络都能用）。</div>
    <div class="widget-entry">
      <div class="we-title">📊 小组件进度版</div>
      <div class="we-desc">更轻量：一眼看进度 + 三件事勾选。可在手机/iPad 另存一个主屏幕图标，孩子一点就打卡。</div>
      <a href="widget.html" target="_blank" class="btn blue" rel="noopener">打开小组件进度 →</a>
    </div>
  </footer>
</main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
